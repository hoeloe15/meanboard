<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>meanboard</title>
  <link rel="preload" href="/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div><span class="mark">m/</span><h1 id="repo">meanboard</h1></div>
    <div id="agent-filter" role="group" aria-label="Filter by agent" hidden></div>
    <button id="palette-hint" title="Command palette"><kbd>Ctrl</kbd><kbd>K</kbd></button>
    <div class="live"><span id="live-dot" title="Connecting"></span><span id="live-text">connecting</span></div>
    <button id="notify" class="quiet" hidden>Enable notifications</button>
  </header>
  <main id="board" aria-label="Kanban board">
    <section class="column draft" data-status="draft">
      <header><h2>Draft</h2><span class="count">0</span></header>
      <details class="add"><summary>＋ New task</summary>
        <form id="add-form"><input name="title" aria-label="Task title" placeholder="Task title" required>
          <textarea name="body" aria-label="Task body" placeholder="Optional notes" rows="3"></textarea>
          <button>Create draft</button></form>
      </details><div class="cards"></div>
    </section>
    <section class="column open" data-status="open"><header><h2>Open</h2><span class="count">0</span></header><div class="cards"></div></section>
    <section class="column progress" data-status="in-progress"><header><h2>In Progress</h2><span class="count">0</span></header><div class="cards"></div></section>
    <section class="column review" data-status="review"><header><h2>Review</h2><span class="count">0</span></header><div class="cards"></div></section>
    <section class="column done" data-status="done"><header><h2>Done</h2><span class="count">0</span></header><button id="archive-all" class="archive-all" hidden>Archive all</button><div class="cards"></div></section>
    <section id="unknown" class="column unknown" hidden><header><h2>?</h2><span class="count">0</span></header><div class="cards"></div></section>
  </main>
  <dialog id="task-dialog" tabindex="-1">
    <div class="dialog-head"><h2 id="task-title"></h2><button id="close" class="icon" aria-label="Close">×</button></div>
    <div class="task-tools">
      <span class="status-pill" id="status-pill"><span class="status-dot"></span><select id="task-status" aria-label="Status"></select></span>
      <select id="task-agent" class="agent-select" aria-label="Assigned agent"></select>
      <span class="meta" id="task-file"></span><span class="meta" id="task-created"></span><span id="task-prs"></span><span class="spacer"></span>
      <button id="edit" class="quiet">Edit</button><button id="archive" class="danger" hidden>Archive</button></div>
    <article id="task-view" class="markdown"></article>
    <section id="task-prdetails" hidden></section>
    <section id="task-activity" class="activity" hidden></section>
    <form id="note-form"><input name="note" placeholder="Write a note — logged on the task" aria-label="Write a note">
      <button>Add note</button></form>
    <div id="task-edit" hidden><textarea id="raw" aria-label="Raw task markdown"></textarea>
      <div class="edit-actions"><button id="cancel" class="quiet">Cancel</button><button id="save">Save</button></div></div>
  </dialog>
  <div id="palette" hidden>
    <div id="palette-box">
      <input id="palette-input" placeholder="Jump to a task, or type to create one…" aria-label="Command palette">
      <div id="palette-list" role="listbox"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
